views:
  - type: sections
    max_columns: 3
    title: Smart Energy System
    path: smart-energy-system
    icon: mdi:dots-circle
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Energiöversikt
            heading_style: subtitle
            icon: mdi:creation
            badges: []
          - type: custom:energy-flow-card-plus
            entities:
              grid:
                name: Elnät
                entity:
                  consumption: sensor.sem_import
                  production: sensor.sem_export
              solar:
                name: Solceller
                entity: sensor.sem_solar_production
                display_zero_state: true
              battery:
                name: Batteri
                icon: mdi:battery-high
                entity:
                  consumption: sensor.batteries_day_discharge
                  production: sensor.batteries_day_charge
              individual:
                - entity: sensor.sem_ev_charge
                  name: Laddbox
                  color: teal
                  icon: mdi:ev-plug-type2
                  display_zero: true
              home:
                name: Ditt hem
            clickable_entities: false
            display_zero_lines: true
            use_new_flow_rate_model: false
            energy_date_selection: false
            wh_decimals: 1
            kwh_decimals: 1
            min_flow_rate: 1
            max_flow_rate: 6
            max_expected_energy: 2000
            min_expected_energy: 10
            wh_kwh_threshold: 1000
            grid_options:
              columns: 60
              rows: auto
            column_span: 2
          - type: heading
            heading: Så arbetar ditt system
            heading_style: subtitle
            icon: mdi:calendar-clock
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.sem_nordpool_active
                icon: mdi:currency-usd
            tap_action:
              action: navigate
              navigation_path: '#system_plan'
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:apexcharts-card
                update_interval: 1 min
                now:
                  show: false
                  color: red
                header:
                  show: false
                graph_span: 48h
                span:
                  start: day
                yaxis:
                  - id: left
                    opposite: false
                    min: 0
                    max: 1
                    show: true
                    apex_config:
                      labels:
                        style:
                          colors: transparent
                      axisBorder:
                        show: true
                        color: transparent
                      axisTicks:
                        show: true
                        color: transparent
                  - id: right
                    opposite: true
                    min: 0
                    max: 1
                    show: true
                    apex_config:
                      labels:
                        style:
                          colors: transparent
                      axisBorder:
                        show: true
                        color: transparent
                      axisTicks:
                        show: true
                        color: transparent
                series:
                  - entity: sensor.sem_energy_plan
                    yaxis_id: right
                    name: Passerat
                    type: area
                    color: '#9CA3AF'
                    stroke_width: 0
                    show:
                      legend_value: false
                      in_chart: true
                    data_generator: |
                      const plan = entity.attributes.hourly_plan || [];
                      const data = [];
                      const nowTime = Date.now();

                      plan.forEach((item) => {
                        const start = new Date(item.start).getTime();
                        const end = new Date(item.end).getTime();

                        if (start < nowTime) {
                          const endTime = Math.min(end, nowTime);

                          data.push([start, 0]);
                          data.push([start, 1]);
                          data.push([endTime, 1]);
                          data.push([endTime, 0]);
                        }
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Batteridrift
                    yaxis_id: right
                    type: area
                    color: '#06B6D4'
                    stroke_width: 0
                    show:
                      legend_value: false
                    data_generator: |
                      const plan = entity.attributes.hourly_plan || [];
                      const data = [];
                      const nowTime = Date.now();

                      plan.forEach((item) => {
                        if (item.plan !== 'battery') return;

                        const start = new Date(item.start).getTime();
                        const end = new Date(item.end).getTime();

                        if (end > nowTime) {
                          const startTime = Math.max(start, nowTime);

                          data.push([startTime, 0]);
                          data.push([startTime, 1]);
                          data.push([end, 1]);
                          data.push([end, 0]);
                        }
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Vänteläge
                    yaxis_id: right
                    type: area
                    color: '#F59E0B'
                    stroke_width: 0
                    show:
                      legend_value: false
                    data_generator: |
                      const plan = entity.attributes.hourly_plan || [];
                      const data = [];
                      const nowTime = Date.now();

                      plan.forEach((item) => {
                        if (item.plan !== 'grid_wait') return;

                        const start = new Date(item.start).getTime();
                        const end = new Date(item.end).getTime();

                        if (end > nowTime) {
                          const startTime = Math.max(start, nowTime);

                          data.push([startTime, 0]);
                          data.push([startTime, 1]);
                          data.push([end, 1]);
                          data.push([end, 0]);
                        }
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Solel
                    yaxis_id: right
                    type: area
                    color: '#FACC15'
                    stroke_width: 0
                    show:
                      legend_value: false
                    data_generator: |
                      const plan = entity.attributes.hourly_plan || [];
                      const data = [];
                      const nowTime = Date.now();

                      plan.forEach((item) => {
                        if (item.plan !== 'solar') return;

                        const start = new Date(item.start).getTime();
                        const end = new Date(item.end).getTime();

                        if (end > nowTime) {
                          const startTime = Math.max(start, nowTime);

                          data.push([startTime, 0]);
                          data.push([startTime, 1]);
                          data.push([end, 1]);
                          data.push([end, 0]);
                        }
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Sol + laddning
                    yaxis_id: right
                    type: area
                    color: '#84CC16'
                    stroke_width: 0
                    show:
                      legend_value: false
                    data_generator: |
                      const plan = entity.attributes.hourly_plan || [];
                      const data = [];
                      const nowTime = Date.now();

                      plan.forEach((item) => {
                        if (item.plan !== 'solar_charge') return;

                        const start = new Date(item.start).getTime();
                        const end = new Date(item.end).getTime();

                        if (end > nowTime) {
                          const startTime = Math.max(start, nowTime);

                          data.push([startTime, 0]);
                          data.push([startTime, 1]);
                          data.push([end, 1]);
                          data.push([end, 0]);
                        }
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Laddning
                    yaxis_id: right
                    type: area
                    color: '#3B82F6'
                    stroke_width: 0
                    show:
                      legend_value: false
                    data_generator: |
                      const data = [];

                      const intervals = [
                        hass.states['sensor.sem_battery_charge_window_cheapest_1a_active']?.state,
                        hass.states['sensor.sem_battery_charge_window_cheapest_2_active']?.state
                      ];

                      const nowTime = Date.now();

                      intervals.forEach((raw) => {
                        if (!raw || raw === 'unknown' || raw === 'unavailable') return;
                        if (!raw.includes(' - ')) return;

                        const parts = raw.split(' - ');
                        if (parts.length < 2) return;

                        const startTime = new Date(parts[0]).getTime();
                        const endTime = new Date(parts[1]).getTime();

                        if (
                          !Number.isFinite(startTime) ||
                          !Number.isFinite(endTime)
                        ) return;

                        if (endTime <= nowTime) return;

                        const visibleStart = Math.max(startTime, nowTime);

                        data.push([visibleStart, 0]);
                        data.push([visibleStart, 1]);
                        data.push([endTime, 1]);
                        data.push([endTime, 0]);
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Export
                    yaxis_id: right
                    type: area
                    color: '#A855F7'
                    stroke_width: 0
                    show:
                      legend_value: false
                    data_generator: |
                      const plan = entity.attributes.hourly_plan || [];
                      const data = [];
                      const nowTime = Date.now();

                      plan.forEach((item) => {
                        if (item.plan !== 'export') return;

                        const start = new Date(item.start).getTime();
                        const end = new Date(item.end).getTime();

                        if (end > nowTime) {
                          const startTime = Math.max(start, nowTime);

                          data.push([startTime, 0]);
                          data.push([startTime, 1]);
                          data.push([end, 1]);
                          data.push([end, 0]);
                        }
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Nätel
                    yaxis_id: right
                    type: area
                    color: '#EF4444'
                    stroke_width: 0
                    show:
                      legend_value: false
                    data_generator: |
                      const plan = entity.attributes.hourly_plan || [];
                      const data = [];
                      const nowTime = Date.now();

                      plan.forEach((item) => {
                        if (item.plan !== 'grid') return;

                        const start = new Date(item.start).getTime();
                        const end = new Date(item.end).getTime();

                        if (end > nowTime) {
                          const startTime = Math.max(start, nowTime);

                          data.push([startTime, 0]);
                          data.push([startTime, 1]);
                          data.push([end, 1]);
                          data.push([end, 0]);
                        }
                      });

                      return data;
                  - entity: sensor.sem_energy_plan
                    name: Planeras
                    yaxis_id: left
                    type: area
                    color: '#EC4899'
                    stroke_width: 0
                    show:
                      legend_value: false
                      in_chart: false
                    data_generator: |
                      const data = [];

                      // Grafen börjar vid dagens 00:00.
                      // Morgondagen börjar 24 timmar efter grafens start.
                      const tomorrowStart = new Date(start);

                      tomorrowStart.setHours(
                        tomorrowStart.getHours() + 24,
                        0,
                        0,
                        0
                      );

                      // Använd grafens slut som slutpunkt.
                      const tomorrowEnd = new Date(end);

                      data.push([tomorrowStart.getTime(), 0]);
                      data.push([tomorrowStart.getTime(), 1]);
                      data.push([tomorrowEnd.getTime(), 1]);
                      data.push([tomorrowEnd.getTime(), 0]);

                      return data;
                apex_config:
                  chart:
                    height: 120
                    offsetX: 10
                  stroke:
                    width: 0
                  fill:
                    opacity: 1
                    type:
                      - pattern
                      - solid
                      - solid
                      - solid
                      - solid
                      - solid
                      - solid
                      - solid
                      - pattern
                    pattern:
                      style:
                        - slantedLines
                        - slantedLines
                        - slantedLines
                        - slantedLines
                        - slantedLines
                        - slantedLines
                        - slantedLines
                        - slantedLines
                        - slantedLines
                      width: 6
                      height: 8
                      strokeWidth: 1
                  dataLabels:
                    enabled: false
                  markers:
                    size: 0
                  tooltip:
                    shared: true
                    intersect: false
                    marker:
                      show: false
                    x:
                      show: true
                      format: HH:mm
                  legend:
                    show: true
                    position: bottom
                  grid:
                    show: false
                  xaxis:
                    type: datetime
                  annotations:
                    xaxis:
                      - x: now
                        borderColor: '#94A3B8'
                        borderWidth: 2
                        strokeDashArray: 0
                        label:
                          show: true
                          text: NU
                          orientation: vertical
              - type: custom:apexcharts-card
                update_interval: 1 min
                graph_span: 48h
                cache: false
                span:
                  start: day
                  offset: +0H
                header:
                  title: Systemets driftplan
                  show: false
                  show_states: false
                  colorize_states: true
                hours_12: false
                stacked: false
                experimental:
                  color_threshold: true
                yaxis:
                  - id: spotpris
                    opposite: false
                    show: true
                    decimals: 1
                    min: 0
                    apex_config:
                      title:
                        text: Elpris (SEK/kWh)
                  - id: solar_power
                    opposite: true
                    show: true
                    apex_config:
                      title:
                        text: Solel (kWh)
                  - id: charge/expensive
                    opposite: true
                    show: false
                    max: 1
                apex_config:
                  chart:
                    height: 170
                    animations:
                      enabled: true
                      easing: easeinout
                      speed: 10
                      animateGradually:
                        enabled: true
                        delay: 150
                  legend:
                    show: true
                    floating: false
                    offsetY: 5
                    position: bottom
                    fontSize: 10px
                  tooltip:
                    enabled: true
                  xaxis:
                    labels:
                      show: true
                      rotate: 0
                      rotateAlways: true
                      logarithmic: false
                      datetimeUTC: false
                  stroke:
                    width: 1
                  plotOptions:
                    candlestick:
                      colors:
                        upward: '#00B746'
                        downward: '#EF403C'
                      wick:
                        useFillColor: true
                all_series_config:
                  show:
                    legend_value: false
                    datalabels: false
                    in_brush: false
                  float_precision: 3
                  invert: false
                  fill_raw: last
                now:
                  show: true
                  label: NU
                  color: red
                series:
                  - entity: sensor.sem_solar_forecast
                    yaxis_id: solar_power
                    data_generator: >
                      return entity.attributes.sem.watt_hours_period.map((entry)
                      => {
                        const value = entry.values / 1000;
                        if (value <= 0) {
                          return [new Date(entry.date), null];
                        }
                        return [new Date(entry.date), value];
                      });
                    name: Solel
                    extend_to: false
                    type: area
                    color: orange
                    opacity: 0.7
                    stroke_width: 3
                    color_threshold:
                      - value: 0
                        color: '#fff9c4'
                      - value: 5
                        color: '#ffeb3b'
                      - value: 15
                        color: '#fbc02d'
                    show:
                      legend_value: false
                      datalabels: false
                      extremas: true
                      in_brush: false
                      in_legend: false
                  - entity: sensor.sem_nordpool_active
                    yaxis_id: spotpris
                    type: area
                    name: Idag
                    opacity: 0.7
                    color: grey
                    extend_to: false
                    data_generator: >
                      const data = entity.attributes.raw_today.map((start,
                      index) => {
                        return [new Date(start["start"]).getTime(), start["value"]];
                      });

                      const last = entity.attributes.raw_today.slice(-1)[0];

                      const lastTime = new Date(last["start"]).getTime();

                      data.push([lastTime + 3600000, last["value"]]); // 

                      return data;
                    color_threshold:
                      - value: -1
                        color: 1E90FF
                      - value: 0.5
                        color: 008000
                      - value: 1
                        color: DAA520
                      - value: 2
                        color: FF0000
                    show:
                      legend_value: false
                      datalabels: false
                      extremas: true
                      in_brush: false
                      in_legend: false
                  - entity: sensor.sem_nordpool_active
                    yaxis_id: spotpris
                    name: Imorgon
                    type: area
                    opacity: 0.7
                    color: grey
                    data_generator: >
                      const data = entity.attributes.raw_tomorrow.map((start,
                      index) => {
                        return [new Date(start["start"]).getTime(), start["value"]];
                      });

                      const last = entity.attributes.raw_tomorrow.slice(-1)[0];
                      const lastTime = new Date(last["start"]).getTime();

                      data.push([lastTime + 3600000, last["value"]]);

                      return data;
                    color_threshold:
                      - value: -1
                        color: 1E90FF
                      - value: 0.5
                        color: 008000
                      - value: 1
                        color: DAA520
                      - value: 2
                        color: FF0000
                    show:
                      legend_value: false
                      datalabels: false
                      extremas: true
                      in_brush: false
                      in_legend: false
                  - entity: sensor.sem_export_limit
                    yaxis_id: charge/expensive
                    name: Begränsar solexport
                    opacity: 0.7
                    color: pink
                    type: area
                    data_generator: |
                      const data = [];
                      const sensorData = entity.state.split(' - ');
                      function parseLocalTime(str) {
                        const parts = str.split(/[- :T]/).map(Number);
                        const date = new Date(parts[0], parts[1] - 1, parts[2], parts[3], parts[4]);
                        return date.getTime();
                      }
                      const startTime = parseLocalTime(sensorData[0]);
                      const endTime = parseLocalTime(sensorData[1]);
                      data.push([startTime, 0]);
                      data.push([startTime, 0.12]);
                      data.push([endTime, 0.12]);
                      data.push([endTime, 0]);
                      return data;
                    show:
                      legend_value: false
                      datalabels: false
                      extremas: false
                      in_brush: false
                      in_legend: false
            grid_options:
              columns: 24
              rows: auto
        column_span: 2
      - type: grid
        cards:
          - type: heading
            heading_style: subtitle
            heading: Översikt
            icon: mdi:account-eye
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:gap-card
                height: 10
              - type: custom:vertical-stack-in-card
                cards:
                  - type: custom:vertical-stack-in-card
                    cards:
                      - square: false
                        type: grid
                        cards:
                          - clock_style: analog
                            clock_size: small
                            show_seconds: true
                            no_background: false
                            border: false
                            ticks: hour
                            type: clock
                          - show_current: false
                            show_forecast: true
                            type: weather-forecast
                            entity: weather.smhi_home
                            forecast_type: daily
                            forecast_slots: 3
                            tap_action:
                              action: none
                            name: HEM
                        columns: 2
                    view_layout:
                      position: sidebar
                view_layout:
                  position: sidebar
              - type: tile
                entity: sensor.sem_house_power
                name: Huset
                icon: mdi:home
                color: blue-grey
                show_entity_picture: false
                hide_state: false
                vertical: false
                tap_action:
                  action: navigate
                  navigation_path: '#house'
                hold_action:
                  action: navigate
                  navigation_path: '#house'
                icon_tap_action:
                  action: navigate
                  navigation_path: '#house'
                features:
                  - type: trend-graph
                features_position: bottom
              - square: false
                type: grid
                cards:
                  - type: tile
                    entity: sensor.power_meter_active_power
                    name: Elnätet
                    icon: mdi:transmission-tower
                    color: red
                    vertical: false
                    tap_action:
                      action: navigate
                      navigation_path: '#grid'
                    icon_tap_action:
                      action: navigate
                      navigation_path: '#grid'
                    features_position: bottom
                  - type: tile
                    entity: sensor.sem_input_power_with_efficiency_loss_kw
                    name: Solceller
                    icon: mdi:solar-power-variant
                    color: primary
                    vertical: false
                    tap_action:
                      action: navigate
                      navigation_path: '#solar'
                    icon_tap_action:
                      action: navigate
                      navigation_path: '#solar'
                    features_position: inline
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: sensor.sem_wallbox_check
                        state: 'True'
                    card:
                      type: tile
                      entity: sensor.sem_ev_sensor_power
                      name: Laddbox
                      icon: mdi:ev-plug-type2
                      color: blue
                      vertical: false
                      tap_action:
                        action: navigate
                        navigation_path: '#wallbox'
                      icon_tap_action:
                        action: navigate
                        navigation_path: '#wallbox'
                      features_position: inline
              - type: tile
                entity: sensor.batteries_charge_discharge_power
                name: Batteriet
                icon: mdi:battery-charging-100
                color: indigo
                vertical: false
                tap_action:
                  action: navigate
                  navigation_path: '#battery'
                icon_tap_action:
                  action: navigate
                  navigation_path: '#battery'
                features:
                  - type: trend-graph
                features_position: bottom
              - square: false
                type: grid
                cards:
                  - type: tile
                    entity: sensor.sem_battery_mode
                    name: Arbetsläge
                    icon: mdi:auto-mode
                    color: indigo
                    hide_state: false
                    vertical: false
                    tap_action:
                      action: none
                    icon_tap_action:
                      action: none
                    features_position: bottom
                  - type: tile
                    entity: sensor.batteries_state_of_capacity
                    name: Nivå
                    icon: mdi:battery
                    color: indigo
                    show_entity_picture: false
                    hide_state: false
                    vertical: false
                    tap_action:
                      action: none
                    icon_tap_action:
                      action: none
                    features_position: inline
                columns: 2
            view_layout:
              position: sidebar
            grid_options:
              columns: 24
              rows: auto
          - type: heading
            heading_style: subtitle
            heading: Systemets driftplan (AI Analys)
            icon: mdi:creation
            tap_action:
              action: navigate
              navigation_path: '#charge_information'
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: input_button.sem_settings_fast
                name: Snabbval
                icon: mdi:order-bool-descending
                tap_action:
                  action: navigate
                  navigation_path: '#settings_fast'
                state_content: name
            visibility:
              - condition: state
                entity: input_boolean.sem_activate_ai
                state: 'on'
          - type: heading
            heading_style: subtitle
            icon: mdi:creation
            tap_action:
              action: navigate
              navigation_path: '#charge_information'
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: input_button.sem_settings_fast
                name: Snabbval
                icon: mdi:order-bool-descending
                tap_action:
                  action: navigate
                  navigation_path: '#settings_fast'
                state_content: name
            visibility:
              - condition: state
                entity: input_boolean.sem_activate_ai
                state: 'off'
            heading: Systemets driftplan
          - type: custom:vertical-stack-in-card
            cards:
              - type: conditional
                conditions: []
                card:
                  type: conditional
                  conditions:
                    - condition: state
                      entity: sensor.sem_battery_charging_interval_next
                      state: '2'
                  card:
                    type: custom:vertical-stack-in-card
                    cards:
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: input_boolean.sem_activate_ai
                            state: 'off'
                        card:
                          type: markdown
                          content: |2
                              {% set interval = states('sensor.sem_battery_charge_window_cheapest_2') %}
                              {% set energy = states('sensor.sem_battery_charge_energy_2_1b') %}
                              {% set sc = state_attr('sensor.sem_battery_charge_energy_2_1b','should_charge') | bool %}
                              {% set supercheap = state_attr('sensor.sem_battery_charge_energy_2_1b','supercheap_charge') %}
                              
                              {% if ' - ' in interval %}
                                {% set start_str, end_str = interval.split(' - ') %}
                                {% set start_time = start_str | as_datetime %}
                                {% set end_time = end_str | as_datetime %}
                                
                              🕛Klockan: {{ start_time.strftime('%H:%M') }} - {{ end_time.strftime('%H:%M') }}{% if sc %}
                              ⚡Laddningsbeslut: Ladda
                              {% else %}
                              ❌ Laddningsbeslut: Ladda ej
                              {% endif %}🔋Beräknad laddning: {{ energy }} kWh{% if is_state('input_boolean.sem_interval_2', 'on') %}
                              ✅Status: Laddar
                              {% else %}
                              💤Status: Inaktiv
                              {% endif %}

                              {% else %}
                                Ingen tid tillgänglig  
                              {% endif %}
                          tap_action:
                            action: navigate
                            navigation_path: '#settings'
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: input_boolean.sem_activate_ai
                            state: 'on'
                        card:
                          type: markdown
                          content: >
                            {{ states('sensor.sem_ai_analys_system') }} {{
                            states('sensor.sem_ai_analys_2') }}


                            {% set ts =
                            state_attr('sensor.sem_ai_analys_2','last_success')
                            %}

                            {% if ts %}
                              <I>{{ as_datetime(ts).strftime('%Y-%m-%d kl %H:%M') }}</I>
                            {% else %}
                              <I>Analyserar</I>
                            {% endif %}
                          card_size: 5
              - type: conditional
                conditions: []
                card:
                  type: conditional
                  conditions:
                    - condition: state
                      entity: sensor.sem_battery_charging_interval_next
                      state: '1'
                  card:
                    type: custom:vertical-stack-in-card
                    cards:
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: input_boolean.sem_activate_ai
                            state: 'on'
                        card:
                          type: markdown
                          content: >-
                            {{ states('sensor.sem_ai_analys_system') }} {{
                            states('sensor.sem_ai_analys_1') }}





                            {% set ts =
