          - type: custom:bubble-card
            card_type: pop-up
            hash: '#charge_information'
            show_header: false
            button_type: name
            sub_button:
              main: []
              bottom: []
            cards:
              - type: heading
                icon: mdi:chart-timeline-variant-shimmer
                heading_style: title
                heading: Systemets driftplan
              - type: markdown
                content: >-
                  🔄 **Systemet analyserar kontinuerligt**


                  Systemets beslut värderas och omvärderas kontinuerligt utifrån
                  aktuella förutsättningar. Det innebär att beslut kan förändras
                  över tid när förutsättningarna ändras. Ett beslut som är
                  optimalt just nu behöver inte vara det bästa alternativet
                  längre fram.
              - type: heading
                icon: mdi:flash
                heading: Laddningsfönster
                heading_style: subtitle
              - type: custom:vertical-stack-in-card
                cards:
                  - type: custom:vertical-stack-in-card
                    cards:
                      - type: markdown
                        content: >
                          {#
                          =========================================================
                             HÄMTA LADDNINGSFÖNSTER
                             ========================================================= #}

                          {% set window_1 =
                          states('sensor.sem_battery_charge_window_cheapest_1a')
                          %} {% set window_2 =
                          states('sensor.sem_battery_charge_window_cheapest_2')
                          %}

                          {% set now_dt = now() %}


                          {#
                          =========================================================
                             PARSA FÖNSTER 1A
                             ========================================================= #}

                          {% if ' - ' in window_1 %}
                            {% set start_1 = as_datetime(window_1.split(' - ')[0]) %}
                            {% set end_1 = as_datetime(window_1.split(' - ')[1]) %}
                          {% else %}
                            {% set start_1 = none %}
                            {% set end_1 = none %}
                          {% endif %}


                          {#
                          =========================================================
                             PARSA FÖNSTER 2
                             ========================================================= #}

                          {% if ' - ' in window_2 %}
                            {% set start_2 = as_datetime(window_2.split(' - ')[0]) %}
                            {% set end_2 = as_datetime(window_2.split(' - ')[1]) %}
                          {% else %}
                            {% set start_2 = none %}
                            {% set end_2 = none %}
                          {% endif %}


                          {#
                          =========================================================
                             VÄLJ NÄSTA AKTUELLA FÖNSTER
                             ========================================================= #}

                          {% set valid_1 = start_1 is not none and end_1 is not
                          none and end_1 > now_dt %} {% set valid_2 = start_2 is
                          not none and end_2 is not none and end_2 > now_dt %}

                          {% if valid_1 and valid_2 %}

                            {% if start_1 <= start_2 %}
                              {% set selected = 1 %}
                            {% else %}
                              {% set selected = 2 %}
                            {% endif %}

                          {% elif valid_1 %}

                            {% set selected = 1 %}

                          {% elif valid_2 %}

                            {% set selected = 2 %}

                          {% else %}

                            {% set selected = 0 %}

                          {% endif %}


                          {#
                          =========================================================
                             DAGFÖNSTER 1A
                             ========================================================= #}

                          {% if selected == 1 %}

                            {% set sensor = 'sensor.sem_battery_charge_energy_1a_2' %}

                            {% set pre_peak = state_attr(sensor, 'pre_peak') | float(0) %}
                            {% set peak = state_attr(sensor, 'peak') | float(0) %}
                            {% set post_peak = state_attr(sensor, 'post_peak') | float(0) %}

                            {% set battery_capacity =
                              state_attr(sensor, 'battery_capacity') | float(0) %}

                            {% set usable_capacity =
                              state_attr(sensor, 'usable_capacity') | float(0) %}

                            {% set solar_surplus =
                              state_attr(sensor, 'estimated_remaining_solar_surplus') | float(0) %}

                            {% set pre_ok =
                              state_attr(sensor, 'pre_peak_profit') is true %}

                            {% set peak_ok =
                              state_attr(sensor, 'peak_profit') is true %}

                            {% set post_ok =
                              state_attr(sensor, 'post_peak_profit') is true %}

                            {% set total_kwh =
                              (pre_peak if pre_ok else 0) +
                              (peak if peak_ok else 0) +
                              (post_peak if post_ok else 0)
                            %}

                            {% set capped_total =
                              [total_kwh, usable_capacity] | min %}

                            {% set after_battery =
                              [capped_total - battery_capacity, 0] | max %}

                            {% set final_need =
                              [after_battery - solar_surplus, 0] | max %}

                            **⚡ Nästa laddningsfönster:** **{{ start_1.strftime('%H:%M') }} - {{ end_1.strftime('%H:%M') }}**


                          {% set sensor =
                          'sensor.sem_battery_charge_energy_1a_2' %} {% set
                          override =
                          states('input_select.sem_battery_charge_override_1a_2')
                          | lower | trim %}

                          {% set should_charge = state_attr(sensor,
                          'should_charge') is true %} {% set
                          battery_charge_profit = state_attr(sensor,
                          'battery_charge_profit') is true %} {% set
                          battery_solar_enough_today = state_attr(sensor,
                          'battery_solar_enough_today') is true %}

                          {% if override == 'auto' %}

                          {% if should_charge %} Laddningsbeslut: 🟢 Ladda

                            Systemet bedömer att laddningen är lönsam och att solelen inte förväntas ladda batteriet tillräckligt.
                          {% else %} Laddningsbeslut: 🔴 Ladda ej

                          {% if battery_solar_enough_today and
                          battery_charge_profit %}

                          Systemet bedömer att solelen förväntas ladda
                          batteriet, trots att laddningen är lönsam.

                          {% elif battery_solar_enough_today and not
                          battery_charge_profit %}

                          Systemet bedömer att solelen förväntas ladda
                          batteriet. Att ladda batteriet med nätel är inte
                          lönsamt.

                          {% elif not battery_solar_enough_today and not
                          battery_charge_profit %}

                          Systemet bedömer att solelen inte förväntas fylla
                          batteriet och att laddningen inte är lönsam.

                          {% endif %} {% endif %}

                          {% elif override == 'ladda' %}

                          Laddningsbeslut: 🟢 Ladda


                          👤 Beslut av användaren

                          {% elif override == 'ladda ej' %}

                          Laddningsbeslut: 🔴 Ladda ej


                          👤 Beslut av användaren


                          {% elif override == 'ladda fullt' %}

                          Laddningsbeslut: 🟢 Ladda batteriet fullt


                          👤 Beslut av användaren

                          {% else %}

                          ⚪ Laddningsbeslut: Okänt

                          {% endif %}

                          {#
                          =========================================================
                             NATTFÖNSTER 2
                             ========================================================= #}

                          {% elif selected == 2 %}

                            {% set sensor = 'sensor.sem_battery_charge_energy_2_1b' %}

                            {% set pre_peak = state_attr(sensor, 'pre_peak') | float(0) %}
                            {% set peak = state_attr(sensor, 'peak') | float(0) %}
                            {% set post_peak = state_attr(sensor, 'post_peak') | float(0) %}

                            {% set usable_capacity =
                              state_attr(sensor, 'usable_capacity') | float(0) %}

                            {% set battery_capacity =
                              state_attr(sensor, 'battery_capacity') | float(0) %}

                            {% set pre_ok =
                              state_attr(sensor, 'pre_peak_profit') is true %}

                            {% set peak_ok =
                              state_attr(sensor, 'peak_profit') is true %}

                            {% set post_ok =
                              state_attr(sensor, 'post_peak_profit') is true %}

                            {% set total_kwh =
                              (pre_peak if pre_ok else 0) +
                              (peak if peak_ok else 0) +
                              (post_peak if post_ok else 0)
                            %}

                            {% set capped_total =
                              [total_kwh, usable_capacity] | min %}

                            {% set charge_needed =
                              [capped_total - battery_capacity, 0] | max %}

                            **⚡ Nästa laddningsfönster:**  **{{ start_2.strftime('%H:%M') }} - {{ end_2.strftime('%H:%M') }}**


                          {% set sensor =
                          'sensor.sem_battery_charge_energy_2_1b' %}

                          {% set override =
                          states('input_select.sem_battery_charge_override_2_1b')
                          | lower | trim %}


                          {% set should_charge = state_attr(sensor,
                          'should_charge') is true %}

                          {% set battery_charge_profit = state_attr(sensor,
                          'battery_charge_profit') is true %}


                          {% if override == 'auto' %}

                            {% if should_charge %}
                            Laddningsbeslut: 🟢 Ladda
                            Systemet bedömer att laddning är lönsam och nödvändig.

                            {% else %}
                            Laddningsbeslut: 🔴 Ladda ej

                            {% if not battery_charge_profit %}
                            Systemet bedömer att laddning inte är lönsam eller nödvändig.

                              {% else %}
                            Systemet bedömer att energibehovet täcks av batteriet.
                              {% endif %}

                            {% endif %}

                          {% elif override == 'ladda' %}

                            Laddningsbeslut: 🟢 Ladda  
                            
                            👤 Beslut av användaren

                          {% elif override == 'ladda ej' %}

                            Laddningsbeslut: 🔴 Ladda ej 
                            
                            👤 Beslut av användaren

                          {% elif override == 'ladda fullt' %}
                            Laddningsbeslut: 🟢 Ladda batteriet fullt

                            👤 Beslut av användaren
                          {% else %}

                            **Laddningsbeslut: ⚪ Okänt**

                          {% endif %}


                          {% endif %}
                      - type: markdown
                        content: '---'
                        text_only: true
                      - type: custom:bubble-card
                        card_type: sub-buttons
                        sub_button:
                          bottom:
                            - name: Inställningar och information
                              show_name: true
                              show_icon: true
                              tap_action:
                                action: toggle
                              icon: mdi:cog
                              force_icon: false
                              fill_width: true
                              content_layout: icon-left
                              entity: input_boolean.sem_override_charge
                              show_background: true
                              state_background: true
                        rows: 0.938
                        hide_main_background: true
                        footer_mode: false
                        footer_full_width: false
                        styles: |-
                          styles: |
                            * { 
                              font-size: 15px !important;
                            }
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: sensor.sem_battery_charging_interval_next
                            state: '2'
                          - condition: state
                            entity: input_boolean.sem_override_charge
                            state: 'on'
                        card:
                          type: custom:vertical-stack-in-card
                          cards:
                            - type: heading
                              icon: mdi:calculator
                              heading: Beräkning
                              heading_style: subtitle
                            - type: markdown
                              content: >-
                                {#
                                =========================================================
                                   HÄMTA LADDNINGSFÖNSTER
                                   ========================================================= #}

                                {% set window_1 =
                                states('sensor.sem_battery_charge_window_cheapest_1a')
                                %}

                                {% set window_2 =
                                states('sensor.sem_battery_charge_window_cheapest_2')
                                %}

                                {% set now_dt = now() %}



                                {#
                                =========================================================
                                   PARSA FÖNSTER 1A
                                   ========================================================= #}

                                {% if ' - ' in window_1 %}
                                  {% set start_1 = as_datetime(window_1.split(' - ')[0]) %}
                                  {% set end_1 = as_datetime(window_1.split(' - ')[1]) %}
                                {% else %}
                                  {% set start_1 = none %}
                                  {% set end_1 = none %}
                                {% endif %}



                                {#
                                =========================================================
                                   PARSA FÖNSTER 2
                                   ========================================================= #}

                                {% if ' - ' in window_2 %}
                                  {% set start_2 = as_datetime(window_2.split(' - ')[0]) %}
                                  {% set end_2 = as_datetime(window_2.split(' - ')[1]) %}
                                {% else %}
                                  {% set start_2 = none %}
                                  {% set end_2 = none %}
                                {% endif %}



                                {#
                                =========================================================
                                   VÄLJ NÄSTA AKTUELLA FÖNSTER
                                   ========================================================= #}

                                {% set valid_1 = start_1 is not none and end_1
                                is not none and end_1 > now_dt %}

                                {% set valid_2 = start_2 is not none and end_2
                                is not none and end_2 > now_dt %}


                                {% if valid_1 and valid_2 %}

                                  {% if start_1 <= start_2 %}
                                    {% set selected = 1 %}
                                  {% else %}
                                    {% set selected = 2 %}
                                  {% endif %}

                                {% elif valid_1 %}

                                  {% set selected = 1 %}

                                {% elif valid_2 %}

                                  {% set selected = 2 %}

                                {% else %}

                                  {% set selected = 0 %}

                                {% endif %}



                                {#
                                =========================================================
                                   DAGFÖNSTER 1A
                                   ========================================================= #}

                                {% if selected == 1 %}

                                  {% set sensor = 'sensor.sem_battery_charge_energy_1a_2' %}

                                  {% set override =
                                    states('input_select.sem_battery_charge_override_1a_2') %}

                                  {% set battery_capacity =
                                    state_attr(sensor, 'battery_capacity') | float(0) %}

                                  {% set usable_capacity =
                                    state_attr(sensor, 'usable_capacity') | float(0) %}

                                  {% set solar_surplus =
                                    state_attr(sensor, 'estimated_remaining_solar_surplus') | float(0) %}

                                  {% set pre_peak =
                                    state_attr(sensor, 'pre_peak') | float(0) %}

                                  {% set peak =
                                    state_attr(sensor, 'peak') | float(0) %}

                                  {% set post_peak =
                                    state_attr(sensor, 'post_peak') | float(0) %}

                                  {% set extra =
                                    state_attr(sensor, 'extra') | float(0) %}

                                  {% set pre_ok =
                                    state_attr(sensor, 'pre_peak_profit') is true %}

                                  {% set peak_ok =
                                    state_attr(sensor, 'peak_profit') is true %}

                                  {% set post_ok =
                                    state_attr(sensor, 'post_peak_profit') is true %}

                                  {% set should_charge_full =
                                    state_attr(sensor, 'should_charge_full') is true %}

                                  {% set safety_margin = 1.0 %}


                                  {# -------------------------------------------------------
                                     LADD
                                     ------------------------------------------------------- #}

                                  {% if override == 'Ladda' %}

                                    {% set charge_needed =
                                      (pre_peak if pre_ok else 0) +
                                      (peak if peak_ok else 0) +
                                      (post_peak if post_ok else 0) +
                                      extra
                                    %}

                                ➕ Energi/laddningsbehov: {{
                                  (
                                    (pre_peak if pre_ok else 0) +
                                    (peak if peak_ok else 0) +
                                    (post_peak if post_ok else 0)
                                  ) | round(2)
                                }} kWh  

                                ➕ Extra laddning: {{ extra | round(2) }} kWh  

                                🟰 Planerad laddning: {{ charge_needed |
                                round(2) }} kWh




                                  {# -------------------------------------------------------
                                     LADDA FULLT
                                     ------------------------------------------------------- #}

                                  {% elif override == 'Ladda fullt' %}

                                    {% set charge_needed = [
                                      usable_capacity - battery_capacity,
                                      0
                                    ] | max %}
                                 
                                    🔋 Batteriets kapacitet: {{ usable_capacity | round(2) }} kWh  
                                    ➖ Energi i batteriet: {{ battery_capacity | round(2) }} kWh   
                                    🟰 Planerad laddning: {{ charge_needed | round(2) }} kWh


                                  {# -------------------------------------------------------
                                     LADDA EJ
                                     ------------------------------------------------------- #}

                                  {% elif override == 'Ladda ej' %}

                                    {% set charge_needed = 0 %}
                                 
                                    🟰 **Planerad laddning: 0 kWh**


                                  {# -------------------------------------------------------
                                     AUTO
                                     ------------------------------------------------------- #}

                                  {% else %}

                                    {% set profitable_extra =
                                      state_attr(sensor, 'profitable_extra') | float(0)
                                      if should_charge_full else 0 %}

                                    {% set normal_total =
                                      (pre_peak if pre_ok else 0) +
                                      (peak if peak_ok else 0) +
                                      (post_peak if post_ok else 0) +
                                      extra +
                                      safety_margin
                                    %}

                                    {% set total_before_battery =
                                      normal_total + profitable_extra %}

                                    {% set capped_total = [
                                      total_before_battery,
                                      usable_capacity
                                    ] | min %}

                                    {% set after_battery = [
                                      capped_total - battery_capacity,
                                      0
                                    ] | max %}

                                    {% set final_need = [
                                      after_battery - solar_surplus,
                                      0
                                    ] | max %}


                                    ➕ Energi/laddningsbehov: {{ normal_total | round(2) }} kWh  
                                    ➕ Tillägg för export: {{ profitable_extra | round(2) }} kWh  
                                    ➖ Energi i batteriet: {{ battery_capacity | round(2) }} kWh  
                                    ➖ Förväntat solöverskott: {{ solar_surplus | round(2) }} kWh  
                                    🟰 Planerad laddning: {{ final_need | round(2) }} kWh

                                  {% endif %}



                                {#
                                =========================================================
