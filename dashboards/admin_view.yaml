                  - type: custom:vertical-stack-in-card
                    cards: []
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: input_boolean.sem_more_info_system
                        state: 'off'
                    card:
                      type: markdown
                      content: >-
                        Systemet optimerar automatiskt hur ditt batteri och din
                        solel används för att minska kostnader och maximera
                        nyttan av din egenproducerade energi.


                        ⚡ **Laddningsfönster**


                        Systemet analyserar elpriset och identifierar de
                        billigaste timmarna för att ladda batteriet. Hur länge
                        batteriet laddas beror på batteriets storlek och vilken
                        laddeffekt som är inställd.


                        ☀️ **Solelsprognos**


                        En prognos beräknar hur mycket solel din anläggning
                        förväntas producera. Den baseras på din geografiska
                        position, anläggningens storlek och väderstreck, och
                        hämtas från tjänsten forecast.solar.

                        Om ingen prognos visas kan det bero på tillfälliga
                        driftstörningar i tjänsten.


                        💤 **Viloläge vid lågt elpris**


                        När elpriset är lågt går systemet in i viloläge. Det
                        innebär att batteriet inte laddas ur, men fortfarande
                        kan laddas.

                        Syftet är att minska slitage på batteriet – det är då
                        mer ekonomiskt att använda el från nätet än att använda
                        lagrad energi.


                        📉 **Viloläge inför pristopp**


                        Inför perioder med höga elpriser kan systemet spara
                        energi i batteriet. Detta görs för att kunna använda
                        batteriet när elen är som dyrast och därmed maximera
                        besparingen.

                        Styrningen anpassas efter hushållets energianvändning.


                        🚫 **Begränsning av solelexport**


                        Om elpriset är 0 kr eller lägre är det inte lönsamt att
                        sälja solel. Då begränsar systemet exporten och använder
                        istället energin inom hushållet.


                        📊 **Prioriterad batteridrift**


                        Systemet identifierar de timmar då elpriset är som högst
                        och prioriterar att använda batteriet då.

                        Hur länge batteriet används anpassas efter:


                        hur mycket energi som finns lagrad

                        hur mycket energi hushållet förväntas använda


                        Det innebär att systemet automatiskt justerar sig för
                        att utnyttja batteriet så effektivt som möjligt.


                        🚗**Skydd vid elbilsladdning**


                        När elbilen laddas pausas urladdningen från batteriet.

                        Detta görs både för att minska slitage och eftersom det
                        inte är ekonomiskt att flytta energi från ett batteri
                        till ett annat.
